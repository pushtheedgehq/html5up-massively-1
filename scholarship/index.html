/* ------------------------------------------------------------------ */
/*  Scroll reveal hook                                                 */
/* ------------------------------------------------------------------ */
function useReveal() {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setVisible(true);
          io.unobserve(el);
        }
      },
      { threshold: 0.15 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({ children, delay = 0, className = "" }) {
  const [ref, visible] = useReveal();
  return (
    <div
      ref={ref}
      className={className}
      style={{
        opacity: visible ? 1 : 0,
        transform: visible ? "translateY(0px)" : "translateY(24px)",
        transition: `opacity 0.7s ease ${delay}ms, transform 0.7s ease ${delay}ms`,
      }}
    >
      {children}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Animated counter                                                   */
/* ------------------------------------------------------------------ */
function Counter({ to, suffix = "", duration = 1400 }) {
  const [ref, visible] = useReveal();
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!visible) return;
    let start = null;
    const step = (ts) => {
      if (start === null) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setVal(Math.floor(eased * to));
      if (progress < 1) requestAnimationFrame(step);
      else setVal(to);
    };
    requestAnimationFrame(step);
  }, [visible, to, duration]);
  return (
    <span ref={ref}>
      {val}
      {suffix}
    </span>
  );
}

/* ------------------------------------------------------------------ */
/*  Countdown                                                          */
/* ------------------------------------------------------------------ */
function useCountdown(target) {
  const [left, setLeft] = useState(target - Date.now());
  useEffect(() => {
    const id = setInterval(() => setLeft(target - Date.now()), 1000);
    return () => clearInterval(id);
  }, [target]);
  const clamped = Math.max(left, 0);
  const d = Math.floor(clamped / 86400000);
  const h = Math.floor((clamped % 86400000) / 3600000);
  const m = Math.floor((clamped % 3600000) / 60000);
  const s = Math.floor((clamped % 60000) / 1000);
  return { d, h, m, s };
}

  const set = (key) => (e) => {
    const val = e && e.target ? e.target.value : e;
    setForm((f) => ({ ...f, [key]: val }));
  };

  const toggleProgram = (name) => {
    setForm((f) => ({
      ...f,
      programs: f.programs.includes(name)
        ? f.programs.filter((p) => p !== name)
        : [...f.programs, name],
    }));
  };

  const canNext = () => {
    if (step === 0) return form.fullName && form.email && form.phone && form.city && form.country && form.ageRange;
    if (step === 1) return form.qualification && form.employment && form.hearAbout;
    if (step === 2) return form.programs.length > 0 && form.cohort && form.laptop && form.internet;
    return true;
  };

  const submit = () => {
    if (!form.agree) return;
    setSubmitted(true);
  };

  if (submitted) {

        {step === 3 && (
          <div className="space-y-5">
            <h3 className="text-lg font-bold" style={{ color: C.white }}>
              Goals
            </h3>
            <Field label="Why do you want to learn tech?">
              <textarea
                rows={3}
                value={form.motivation}
                onChange={set("motivation")}
                style={{ ...inputStyle, resize: "vertical" }}
                placeholder="Tell us a little about your why..."
              />
            </Field>
            <Field label="Career Goal">
              <TextInput value={form.goal} onChange={set("goal")} placeholder="e.g. Land a junior developer role" />
            </Field>
            <div>
              <span className="text-sm font-medium" style={{ color: C.white }}>Can you dedicate at least 10 hours weekly?</span>
              <div className="mt-2"><ChoiceGroup options={["Yes", "No"]} value={form.commitment} onChange={(v) => set("commitment")(v)} /></div>
            </div>
            <div>
              <span className="text-sm font-medium" style={{ color: C.white }}>Payment Preference</span>
              <div className="mt-2"><ChoiceGroup options={["Full Payment", "Installments", "Employer Sponsored"]} value={form.payment} onChange={(v) => set("payment")(v)} /></div>
            </div>
            <label className="flex items-start gap-3 text-sm cursor-pointer" style={{ color: C.muted }}>
              <input type="checkbox" checked={form.agree} onChange={(e) => setForm((f) => ({ ...f, agree: e.target.checked }))} className="mt-1" />
              I agree to the terms.
            </label>
          </div>
        )}
      </div>

      <div className="px-6 md:px-8 pb-8 flex items-center justify-between">
        {step > 0 ? (
          <GhostButton onClick={() => setStep((s) => s - 1)} className="!px-5 !py-2.5">
            <ChevronLeft size={15} /> Back
          </GhostButton>
        ) : <span />}

        {step < totalSteps - 1 ? (
          <PrimaryButton onClick={() => canNext() && setStep((s) => s + 1)} className={!canNext() ? "opacity-50 pointer-events-none" : ""}>
            Next
          </PrimaryButton>
        ) : (
          <PrimaryButton onClick={submit} className={!form.agree ? "opacity-50 pointer-events-none" : ""}>
            Submit Application
          </PrimaryButton>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  FAQ                                                                 */
/* ------------------------------------------------------------------ */
function FaqItem({ q, a, open, onClick }) {
  return (
    <div className="rounded-xl overflow-hidden" style={{ border: `1px solid ${C.border}`, background: C.card }}>
      <button
        className="w-full flex items-center justify-between px-5 py-4 text-left"
        onClick={onClick}
      >
        <span className="font-medium text-sm" style={{ color: C.white }}>{q}</span>
        <ChevronDown
          size={18}
          style={{ color: C.muted, transform: open ? "rotate(180deg)" : "rotate(0)", transition: "transform 0.3s ease" }}
        />
      </button>
      <div
        style={{
          maxHeight: open ? 200 : 0,
          overflow: "hidden",
          transition: "max-height 0.35s ease",
        }}
      >
        <p className="px-5 pb-4 text-sm" style={{ color: C.muted }}>{a}</p>
      </div>
    </div>
  );
}

function Faq() {
  const [open, setOpen] = useState(0);
  return (
    <section id="faq" className="py-24 px-6 md:px-10" style={{ background: C.bg2 }}>
      <div className="max-w-3xl mx-auto">
        <Reveal>
          <Pill>FAQ</Pill>
          <h2 className="mt-4 text-3xl md:text-4xl font-extrabold" style={{ color: C.white, ...sans }}>
            Questions, answered
          </h2>
        </Reveal>
        <div className="mt-10 space-y-3">
          {FAQS.map((f, i) => (
            <Reveal key={f.q} delay={i * 40}>
              <FaqItem q={f.q} a={f.a} open={open === i} onClick={() => setOpen(open === i ? -1 : i)} />
            </Reveal>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ------------------------------------------------------------------ */
/*  Final CTA + Footer                                                 */
/* ------------------------------------------------------------------ */
function FinalCta({ onApply, onWhatsapp }) {
  return (
    <section className="px-6 md:px-10 py-20" style={{ background: C.bg }}>
      <Reveal>
        <div
          className="max-w-5xl mx-auto rounded-3xl p-10 md:p-16 text-center relative overflow-hidden"
          style={{ background: `linear-gradient(135deg, ${C.card}, ${C.bg2})`, border: `1px solid ${C.border}` }}
        >
          <div
            className="absolute -top-20 -right-20 w-64 h-64 rounded-full"
            style={{ background: C.lime, opacity: 0.08, filter: "blur(60px)" }}
          />
          <h2 className="text-3xl md:text-5xl font-extrabold" style={{ color: C.white, ...sans }}>
            Ready to Change Your Career?
          </h2>
          <p className="mt-4 max-w-lg mx-auto" style={{ color: C.muted }}>
            Join hundreds of students building successful careers in technology.
          </p>
          <div className="mt-8 flex flex-wrap gap-4 justify-center">
            <PrimaryButton onClick={onApply}>Apply Now</PrimaryButton>
            <GhostButton onClick={onWhatsapp}><MessageCircle size={15} /> Chat on WhatsApp</GhostButton>
          </div>
        </div>
      </Reveal>
    </section>
  );
}

function Footer() {
  return (
    <footer className="px-6 md:px-10 py-14" style={{ background: C.bg2, borderTop: `1px solid ${C.border}` }}>
      <div className="max-w-7xl mx-auto grid md:grid-cols-4 gap-10">
        <div>
          <div className="flex items-center gap-2.5">
            <PTELogoMark size={34} />
            <span className="text-lg font-bold" style={{ color: C.white }}>
              PushTheEdge
            </span>
          </div>
          <p className="mt-3 text-sm" style={{ color: C.muted }}>Learn. Build. Grow.</p>
        </div>
        <div>
          <h4 className="text-sm font-semibold" style={{ color: C.white }}>Quick Links</h4>
          <ul className="mt-3 space-y-2 text-sm" style={{ color: C.muted }}>
            <li>Courses</li><li>Privacy Policy</li><li>Terms</li>
          </ul>
        </div>
        <div>
          <h4 className="text-sm font-semibold" style={{ color: C.white }}>Contact</h4>
          <ul className="mt-3 space-y-2 text-sm" style={{ color: C.muted }}>
            <li>WhatsApp</li><li>Instagram</li><li>LinkedIn</li><li>hello@pushtheedge.com</li>
          </ul>
        </div>
        <div>
          <h4 className="text-sm font-semibold" style={{ color: C.white }}>Get Started</h4>
          <p className="mt-3 text-sm" style={{ color: C.muted }}>Applications open for the August 2026 cohort.</p>
        </div>
      </div>
      <div className="max-w-7xl mx-auto mt-10 pt-6 text-xs" style={{ borderTop: `1px solid ${C.border}`, color: C.muted }}>
        &copy; {new Date().getFullYear()} PushTheEdge. All rights reserved.
      </div>

}

/* ------------------------------------------------------------------ */
/*  Root                                                                */
/* ------------------------------------------------------------------ */

    window.open("https://wa.me/2340000000000", "_blank");

  return (

      <WhyChooseUs />

            <Pill>Application</Pill>
            <h2 className="mt-4 text-3xl md:text-4xl font-extrabold" style={{ color: C.white, ...sans }}>

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PushTheEdgeLanding />);
</script>
</body>
